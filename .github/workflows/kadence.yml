name: Kadence VM retry

on:
  schedule:
    # Every 10 min (repo is public = unlimited Actions minutes).
    # If you make the repo private again, change to "*/30 * * * *" (2000 free min/month).
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: kadence
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the job disable itself once the VM is up
  issues: write    # opens an issue (you get an email) on success / blocked

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: pip install -r requirements.txt

      - name: Write OCI config and SSH key from secrets
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_PEM: ${{ secrets.OCI_KEY_PEM }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          umask 077
          mkdir -p ~/.oci ~/.ssh

          # Clean a pasted value: drop spaces/CR/LF, an accidental "NAME=" prefix and quotes.
          clean() { printf '%s' "$1" | tr -d '\r\n\t ' | sed -E 's/^[A-Za-z_]+=//; s/^["'"'"']//; s/["'"'"']$//'; }
          U=$(clean "$OCI_USER"); T=$(clean "$OCI_TENANCY"); F=$(clean "$OCI_FINGERPRINT"); R=$(clean "$OCI_REGION")

          # Check shapes only (never prints values).
          bad=0
          case "$U" in ocid1.user.*) ;; *) echo "::error::Secret OCI_USER is empty or not an ocid1.user... value"; bad=1;; esac
          case "$T" in ocid1.tenancy.*) ;; *) echo "::error::Secret OCI_TENANCY is empty or not an ocid1.tenancy... value"; bad=1;; esac
          case "$F" in ??:??:??:??:??:??:??:??:??:??:??:??:??:??:??:??) ;; *) echo "::error::Secret OCI_FINGERPRINT is empty or not 16 hex pairs like cb:8f:..."; bad=1;; esac
          [ -n "$R" ] || { echo "::error::Secret OCI_REGION is empty"; bad=1; }
          [ -n "$SSH_PUBLIC_KEY" ] || { echo "::error::Secret SSH_PUBLIC_KEY is empty"; bad=1; }
          [ -n "$OCI_KEY_PEM" ] || { echo "::error::Secret OCI_KEY_PEM is empty"; bad=1; }
          [ "$bad" = 0 ] || exit 1

          # Private key: accept raw PEM, or base64 of the PEM by mistake.
          case "$OCI_KEY_PEM" in
            *"BEGIN"*) printf '%s\n' "$OCI_KEY_PEM" > ~/.oci/oci_api_key.pem ;;
            *) printf '%s' "$OCI_KEY_PEM" | tr -d '\r\n ' | base64 -d > ~/.oci/oci_api_key.pem ;;
          esac
          # Keep only the BEGIN..END block (drops stray text such as a trailing "OCI_API_KEY" line).
          sed -n '/-----BEGIN/,/-----END/p' ~/.oci/oci_api_key.pem > ~/.oci/key.tmp && mv ~/.oci/key.tmp ~/.oci/oci_api_key.pem
          if ! grep -q "BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY" ~/.oci/oci_api_key.pem || ! grep -q "END " ~/.oci/oci_api_key.pem; then
            echo "::error::Secret OCI_KEY_PEM is not the private key. It must start with -----BEGIN PRIVATE KEY----- and end with -----END PRIVATE KEY-----. Copy it from oci_api_key.pem (not the _public file, not the SSH key)."
            exit 1
          fi
          chmod 600 ~/.oci/oci_api_key.pem

          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/control-hub.pub
          {
            echo "[DEFAULT]"
            echo "user=$U"
            echo "fingerprint=$F"
            echo "tenancy=$T"
            echo "region=$R"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > ~/.oci/config

      - name: Attempt launch (one try)
        id: launch
        env:
          KADENCE_NO_JITTER: "1"
        run: |
          set +e
          python create_kadence.py 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          last=$(tail -n 1 out.txt)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "### $last" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: VM is up - notify and stop retrying
        if: startsWith(steps.launch.outputs.last, 'KADENCE_RUNNING')
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Kadence VM is RUNNING" \
            --body "${{ steps.launch.outputs.last }}. Connect with: ssh -i ~/.ssh/control-hub ubuntu@<the IP above>. This workflow has disabled itself."
          gh workflow disable "Kadence VM retry" --repo "$GITHUB_REPOSITORY"

      - name: Blocked - notify and stop retrying
        if: startsWith(steps.launch.outputs.last, 'KADENCE_BLOCKED')
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Kadence launch is BLOCKED" \
            --body "${{ steps.launch.outputs.last }}. Fix the cause, then re-enable the workflow in the Actions tab."
          gh workflow disable "Kadence VM retry" --repo "$GITHUB_REPOSITORY"

      - name: Unexpected error - fail the run (GitHub emails you)
        if: steps.launch.outputs.code != '0' && !startsWith(steps.launch.outputs.last, 'KADENCE_BLOCKED')
        run: exit 1
